# Reverse proxy with a weighted upstream.
# nginx/upstream/upstream.conf (generated by scripts/release.sh) decides who gets traffic:
#   server app-blue:8080 weight=80;   server app-green:8080 weight=20;   ("down" = no traffic)
# release.sh applies a change with "nginx -s reload". A reload is graceful: old workers
# finish their in-flight requests while new workers take all new connections.

log_format main '$remote_addr "$request" $status ver=$upstream_http_x_app_version upstream=$upstream_addr rt=${request_time}s';
access_log /dev/stdout main;

upstream app {
    include /etc/nginx/upstream/upstream.conf;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    absolute_redirect off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /dashboard { return 301 /dashboard/; }

    location /dashboard/ {
        alias /usr/share/nginx/html/dashboard/;
        index index.html;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        # Retry the other server only when a connection fails or times out.
        # A server answering HTTP 500 is NOT retried, so bad releases stay visible.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}
