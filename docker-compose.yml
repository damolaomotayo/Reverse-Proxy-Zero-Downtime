name: zd-box

x-app: &app
  build:
    context: ./app
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
  image: zd-app:local
  restart: unless-stopped
  mem_limit: 128m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

services:
  # Two identical "slots". Whichever is idle gets the next release.
  app-blue:
    <<: *app
    container_name: zd-app-blue
    environment:
      SLOT: blue
      VERSION: "${BLUE_VERSION:-v1}"
      FAULT: "${BLUE_FAULT:-none}"
    ports:
      - "127.0.0.1:18081:8080"   # health checks from the instance only

  app-green:
    <<: *app
    container_name: zd-app-green
    environment:
      SLOT: green
      VERSION: "${GREEN_VERSION:-v1}"
      FAULT: "${GREEN_FAULT:-none}"
    ports:
      - "127.0.0.1:18082:8080"

  # The only public port. Reached at http://<EC2-PUBLIC-IP>/
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: zd-nginx
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - app-blue
      - app-green
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/upstream:/etc/nginx/upstream:ro
      - ./dashboard:/usr/share/nginx/html/dashboard:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
